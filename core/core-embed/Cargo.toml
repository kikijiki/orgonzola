[package]
name = "core-embed"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "orgonzola embedding seam: Embedder trait + deterministic hash embedder + chunking + cosine. Pure, host-agnostic."

[dependencies]
serde = { workspace = true }
# AST-aware chunking: text-splitter over tree-sitter (code) or Markdown structure (prose).
text-splitter = { version = "0.31", features = ["code", "markdown"] }
tree-sitter = { workspace = true }
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"
tree-sitter-bash = "0.25"
# Real embedder and reranker. Off by default: pulls onnxruntime. rustls variants only, since
# fastembed's defaults pull in native-tls and OpenSSL.
fastembed = { version = "5", optional = true, default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
    "image-models",
] }
# Only used by FastEmbedder's error type.
thiserror = { workspace = true, optional = true }

[features]
default = []
# Enables `FastEmbedder`.
fastembed = ["dep:fastembed", "dep:thiserror"]
