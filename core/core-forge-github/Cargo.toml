[package]
name = "core-forge-github"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GitHub implementation of the core-forge Forge trait: owns the REST endpoints, JSON shapes, pagination, and cursor encoding, returning normalized domain types."

[features]
# The live test needs the reqwest transport. Off by default so unit tests stay headless.
default = []
http = ["core-github/http"]

[dependencies]
core-github = { path = "../core-github" }
core-forge = { path = "../core-forge" }
core-store = { path = "../core-store" }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The live test drives a real SyncEngine. core-sync dev-depends back on this crate; Cargo allows
# that dev-dependency cycle.
core-sync = { path = "../core-sync" }
