[package]
name = "core-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "orgonzola knowledge-base store: SQLite schema + typed access. Host-agnostic, local-first."

[dependencies]
core-embed = { path = "../core-embed" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
# sqlite-vec statically links a SQLite extension providing vec0 virtual tables. Registered via
# sqlite3_auto_extension before any connection opens; the version matches sqlx-sqlite's libsqlite3-sys 0.30.
sqlite-vec = "0.1"
libsqlite3-sys = "0.30"

[dev-dependencies]
tokio = { workspace = true }
